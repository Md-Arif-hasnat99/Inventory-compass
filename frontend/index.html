<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/compass.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Inventory Compass — Demand Forecasting & Smart Replenishment</title>
    <meta name="title" content="Inventory Compass — Demand Forecasting & Smart Replenishment" />

    <meta
      name="keywords"
      content="inventory management, demand forecasting, replenishment planning, reorder point, safety stock, EOQ, retail inventory, stockout prevention, supply chain optimization"
    />
    <meta name="author" content="Inventory Compass Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://inventorycompass.app/" />

    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inventory Compass" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inventory Compass" />
    <meta property="og:title" content="Inventory Compass — Demand Forecasting & Smart Replenishment" />
    <meta
      property="og:description"
      content="Data-driven retail demand forecasting and automated replenishment planning. Calculate reorder points (ROP), prevent stockouts, optimize safety stock buffers, and export purchase order drafts."
    />
    <meta property="og:image" content="/compass.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inventory Compass — Demand Forecasting & Smart Replenishment" />

    />

    <!-- JSON-LD Structured Data for WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Inventory Compass",
        "url": "https://inventorycompass.app/",
        "description": "Retail demand forecasting and automated replenishment planning application for data-driven inventory decisions.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Automated Purchase Replenishment Recommendations",
          "Multi-horizon Predictive Demand Forecasting (7, 14, 30 days)",
          "Reorder Point (ROP) & Safety Stock Dynamic Optimization",
          "Real-time Stockout Vulnerability Tracking",
          "CSV Sales & Inventory Dataset Ingestion",
          "Plain-English Inventory Terms & Glossary Guide"
        ]
      }

  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
